[package]
name = "de-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny inline directory explorer for your shell"
license = "MIT"
repository = "https://github.com/reyamira/de"
homepage = "https://github.com/reyamira/de"
readme = "README.md"
keywords = ["cli", "directory", "terminal", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "de"
path = "src/lib.rs"

[[bin]]
name = "de"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1", features = ["fs"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3.22.0"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
toml_edit = "0.23"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
strip = true
