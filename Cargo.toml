[package]
name = "de"
version = "0.1.0"
edition = "2024"
description = "A tiny inline directory explorer for your shell"
license = "MIT"
keywords = ["cli", "directory", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.22.0"

[profile.release]
lto = "thin"
strip = true
