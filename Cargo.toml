[package]
name = "de-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny inline directory explorer for your shell"
license = "MIT"
repository = "https://github.com/reyamira/de"
homepage = "https://github.com/reyamira/de"
readme = "README.md"
keywords = ["cli", "directory", "terminal", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "de"
path = "src/lib.rs"

[[bin]]
name = "de"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
toml_edit = "0.23"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.22.0"

[profile.release]
lto = "thin"
strip = true
