[package]
name = "de-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny inline directory explorer for your shell"
license = "MIT"
repository = "https://github.com/reyamira/de"
homepage = "https://github.com/reyamira/de"
readme = "README.md"
keywords = ["cli", "directory", "terminal", "tui"]
categories = ["command-line-utilities"]
include = ["src/**", "assets/**", "tests/**", "docs/**", "demo/**", "vendor/**", "README.md", "LICENSE"]

[lib]
name = "de"
path = "src/lib.rs"

[[bin]]
name = "de"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
fmd-font = { version = "=0.4.0", features = ["bundled-faces", "cjk-face", "emoji-face"] }
franken_markdown = { version = "=0.7.0", default-features = false, features = ["cjk-face", "emoji-face"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ignore = "0.4"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
resvg = { version = "0.45", default-features = false, features = ["raster-images", "text"] }
rustix = { version = "1", features = ["event", "fs", "termios"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
svgtypes = "0.15"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-onig", "yaml-load"] }
termina = "=0.3.3"
tempfile = "3.22.0"
toml_edit = "0.23"
unicode-width = "0.2.2"
unicode-segmentation = "1.12"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
rustix = { version = "1", features = ["pty", "termios"] }

[profile.release]
lto = "thin"
strip = true
